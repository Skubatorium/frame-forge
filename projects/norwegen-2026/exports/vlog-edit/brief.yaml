# Vollversion mit Karten-HUD (unten rechts, durchgehend), Etappen-/Ortsdetails. ~18:24 Min.
preset: nordic-cinematic
# Korrigiert 2026-08-08 (war 1200 = 20 Min): audio-designer hat die drei Pflicht-Tracks
# gemessen, Aguila de Oro (Ecstatic Mix) ist real nur 374,63 s statt der urspruenglich
# angenommenen 480 s fuer Abschnitt C. Regel: Musik-Gesamtlaenge bestimmt Filmlaenge, nicht
# umgekehrt — Kapitel werden an die echten Tracklaengen angepasst, nicht die Musik gedehnt/
# geloopt. Neue Laenge = 730 s (Wechselpunkt Naturaleza->Aguila de Oro) + 373,887 s
# (gemessene Restlaenge Aguila de Oro ab src_in 0,743 s) = 1103,887 s.
# Nochmal korrigiert 2026-08-08 (Preview-Feedback Runde 1): Cold-Open von 40 s auf 10 s
# halbiert (Nutzer fand die reine Schwarzbild-Strecke zu lang), alles danach um 30 s nach
# vorne verschoben. Neue Laenge 1073,887 s.
# Runde 3: +11s gegenueber 1074. Der Nutzer wollte die Moewen-Passage aus dem 75s-Drohnenshot
# `20260803-drone-574c7c` laenger im Film ("noch ein bisschen laenger reinnehmen, da gab es noch
# tollere Szenen") -- daraus sind zwei eigene Szenen geworden (Verfolgung 8,6s + naher
# Vorbeiflug 3,65s). Bewusste Verlaengerung, kein Ausrutscher.
# Runde 4: -5s auf Nutzerwunsch ("wir brauchen nur so 5 Sekunden, muessen wir irgendwo
# einsparen"), genommen am Schluss: 04.08. von 8,4s auf 6,9s je Clip und das Schlussschwarz von
# 3,0s auf 2,5s. Ergibt 1080,35 s = 18:00.
target_duration_s: 1080
language: de

# --- Overrides ---
transition_vocabulary: [fade, slow_dissolve, cut]
map_usage: leitmotif  # Karte unten rechts durchgehend sichtbar, nicht nur zwischen Kapiteln
photo_treatment: { ken_burns: subtle }
text_density: moderate  # Intro-Infocard (Reisedaten/Route) zusaetzlich zum Titel, sonst wie drone-edit sparsam

# --- Inhaltliche Vorgaben ---
chronological: true
selection:
  prefer_source: [drone, phone]
  min_rating: 3
  avoid_redundant_angles: true  # s. Notizen: gleiche Szene aus mehreren Perspektiven nur sparsam

map:
  position: bottom_right
  show_elevation: false  # kein Hoehenprofil/keine Hoehenmeter-Anzeige
  show_km: true           # gesamt gefahrene Strecke bis zur aktuellen Position (cumulative_km)
  show_place: true        # aktueller Ort/Etappe (stage_label)

audio:
  tracks: [cuatro-vientos, naturaleza-mose-edit, aguila-de-oro-ecstatic-mix]  # feste Reihenfolge
  transition: crossfade
  transition_duration_s: 10  # zuegiger Uebergang, keine lange Ueberlagerung (kein 30s+ Doppel-Layer)
  fade_in_s: 3
  fade_out_s: 3
  structure_hint: three_parts

intro:
  transition_in: black
  cold_open_s: 30  # erste 30 s nur Wind/Cuatro-Vientos-Intro, noch kein Schnitt-Tempo
  cold_open_content: map_overview_reveal  # Deutschland -> Daenemark -> Norwegen, Route waechst waehrend Wind-Sound
  cold_open_visual: light_dissolve_to_norway  # leichte Blende von der Karten-Overview ins erste Norwegen-Bild
  info_card: true  # zusaetzliche Karte mit Reisedaten (Zeitraum/Strecke), vor oder nach Titel
  title: "Norwegen 2026"
  subtitle: "Roadtrip"
  energy_ramp: with_audio  # Bild-Tempo/Schnittfrequenz zieht an, sobald Cuatro Vientos schneller/hoeher wird
  fade: slow

outro:
  transition_out: black

notes: >-
  Cold Open (Task fuer story-architect/map-animator, ggf. neuer Beat statt neuer Agent — s.
  Ruecksprache mit Nutzer): 30 s reiner Wind-/Ambient-Teil von "Cuatro Vientos", dazu eine
  Karten-Overview-Animation (Route Deutschland->Daenemark->Norwegen waechst), danach leichte
  Blende ins erste echte Norwegen-Bild. Bild-Schnittfrequenz zieht erst an, sobald das Audio
  lauter/hoeher wird (Sync-Punkt aus der Audiodatei, kein festes Timecode-Raten). Zusaetzlich
  eine ruhige Infokarte mit Reisedaten (Zeitraum, Gesamtstrecke) - Text/Position analog
  bestehender SVG-Templates, kein neues Layout-System.

  Musik: drei Pflicht-Tracks in fester Reihenfolge (Cuatro Vientos -> Naturaleza Mose Edit ->
  Aguila de Oro Ecstatic Mix), fliessend ineinander ueberblendet. Uebergaenge zuegig (~10 s),
  keine lange Doppel-Ueberlagerung von mehr als ~15 s. Guter, sauberer Uebergang besonders am
  zweiten Wechsel (Naturaleza Mose Edit -> Aguila de Oro).

  Karte (unten rechts, `render_inset_frames`): keine Hoehenmeter/kein Hoehenprofil -
  `heights=None` beim Aufruf (bestehender Mechanismus, kein neuer Code noetig), nur
  Ortsname/Etappe + gesamt gefahrene Strecke bis zur aktuellen Position. Kann spaeter bei
  Bedarf wieder aktiviert werden, aktuell erster Ansatz zum Anschauen/Optimieren.

  Ken Burns: nie schwarzen Hintergrund zeigen, Bild muss die Flaeche immer vollstaendig
  fuellen (Crop/Scale pruefen, kein Letterboxing durch zu kleinen Ken-Burns-Ausschnitt).

  Redundanz: dieselbe Szene nicht aus zu vielen Perspektiven hintereinander zeigen (Beispiel
  aus Sichtung: Bruecke ueber/unter/davor mehrfach hintereinander in der Drohnen-Sichtung -
  das war zu viel). Verschiedene Perspektiven derselben Sache sind grundsaetzlich okay
  (Schiff nah + fern), aber sparsam und nicht als Serie.

  Reihenfolge/Chronologie bei fehlenden Metadaten: viele iPhone-Videos (v. a. Chris-iPhone,
  Christina-iPhone) haben keine `captured_at`-EXIF-Daten mehr. Laut Nutzer liegen die Dateien
  innerhalb ihrer jeweiligen Ordner (Chris-iPhone, Christina-iPhone) in der tatsaechlichen
  Erlebnis-Reihenfolge - Dateisystem-/Namensreihenfolge als Fallback-Sortierung nutzen, wo
  `captured_at` fehlt, statt zu raten oder EXIF zu erzwingen.

  O-Ton: wird in dieser Version voraussichtlich nicht genutzt (`original_audio_policy` bleibt
  wie im Preset `ambience_only`).

must_shots: []
forbidden_shots: []
