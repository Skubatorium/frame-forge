# --------------------------------------------------------------------- Muss-Anker (Erzählung)
# Die vollständige, verbindliche Muss-Liste steckt in assets.json (content.priority == "must",
# 156 Assets) und wird vom timeline-builder garantiert eingeplant. `must_shots` hier bleibt
# LEER — die QC-Prüfung `_check_against_brief` matcht Einträge stumpf als Asset-IDs gegen die
# Timeline; freitextliche Anker würden dort alle als "fehlt" gemeldet. Die dramaturgischen
# Anker + ihre Reihenfolge stehen in editorial-notes.md §"Reihenfolge-Zwänge" und im
# beatsheet.md.
must_shots: []

notes: >-
  Zweiakter mit drittem, kurzem Ausklang. AKT 1 "GEDIEGEN" (Vivaldi "Der Winter", ganze
  211,5 s): Freitag-Anreise, Unterkunft, Pizza-Abend, Samstag-Frühstück, Stadtbummel Brüssel
  (Grand Place, Belgian Beer Weekend, Galeries, Waffeln, Schokolade kaufen, Manneken Pis /
  Duck Store, MOK Coffee, Pommes). Langsamer, warmer Schnitt, ruhige Ausschnitte, leiser
  selbstironischer Humor ("wir sind schon ziemlich alt geworden"). KEINE Comic-FX-Dichte —
  bewusst der Kontrast zu Akt 2; ein einzelner dezenter Akzent (z.B. ein Herzchen) ist
  erlaubt. Texteinblendungen in Akt 1 sind trocken/klein und stehen möglichst am Bildrand,
  nicht mittig (Christian: kein roter Rahmen aus der Mitte).

  AKT 2 "ESKALATION" (Galvanize [Edit], ganze 271,4 s): ab der ersten Kneipe (à la Bécasse),
  jetzt mit der ganzen Gruppe. Bierverkostung Delirium, Kreisbilder, Rooftop Bar 58 mit
  Sonnenuntergang, blaue Stunde, Burger, dann Red Karaoke-Bar mit Cast-Intro mittendrin,
  Tanz/Gesang/Tequila, Weiterziehen (Delirium Village, Dubliner), Taxi, "abgeschossen im
  Bett", Gurken-Gag. Schnelle, laute Beat-Cuts, Comic-FX aktiv aber als Akzent. Im zweiten
  Teil liegen mehr Videos — die tragen hier den Rhythmus mit.

  AFTERMATH/OUTRO (Where Is My Mind, src_in ~17 s, nur ~35-45 s): abrupter Wechsel aus der
  Party in die Stille. Nächster Morgen auf den Sofas, "alle sind erledigt", Christoph/
  Kotz-Bilder (dezent), Micha zerstört, dann die zwei Auto-Schlaf-Fotos. Musik faded aus,
  Schluss-Standbild JGA_OUTRO ("Danke") -> Schwarz.

  Chronologie: captured_at aus EXIF nutzen, wo vorhanden. Ohne Zeitstempel sind die
  Hagi-Fotos (IMG_1697-1708) und die vier UUID-JPGs — deren grobe Einordnung steht in
  editorial-notes.md. Reihenfolge-Zwänge (z.B. "IMG_1444 vor IMG_1443", "1518 vor 1556",
  "1508 spät, kurz vor Verlassen der Rooftop-Bar", "Gruppen-Foto der Zusteiger vor 1445")
  ebenfalls dort.

  Redundanz vermeiden: viele sehr ähnliche Rooftop-/Sonnenuntergangs-/Bar-Aufnahmen. Nicht
  mehrere fast gleiche hintereinander (z.B. 1356 & 1358 nicht direkt nacheinander; die drei
  Manneken-Pis-Perspektiven 1409/1410/1411 auseinanderziehen).

  Wackel-/Dunkelheit: Party-Material ist teils dunkel/neonstichig und verwackelt — bei
  gleichwertiger Auswahl das ruhigere/schärfere nehmen; wo ein Wackler mitten im Take sitzt,
  eher kürzen.
