# Export "JGA" — Micha im Delirium 2026 (Junggesellenabschied Brüssel)
#
# Erstellt 2026-09-09 aus Christians vollständiger Sicht-/Skript-Durchsprache (Voice-Transkript).
# Muss-/Nice-Einstufung der Assets liegt in assets.json (via `set-priority --from-file
# exports/JGA/priorities.csv`, 156 must + 50 nice). Zwei Assets hart gesperrt (`frameforge
# exclude`): IMG_4745 (unvorteilhaft), IMG_8338 (Datei defekt).
#
# DETAIL-REGIE pro Bild/Clip (Texteinblendungen, Schnitt-In/Out-Punkte, FX-Stellen,
# Reihenfolge-Zwänge) steht in exports/JGA/editorial-notes.md PLUS
# exports/JGA/editorial-notes-round2.md (Preview-Feedback, überschreibt Runde 1 punktuell) —
# story-architect, timeline-builder und party-fx MÜSSEN BEIDE Dateien lesen.
#
# RUNDE 2 (2026-09-09, nach erstem Preview): Musik komplett getauscht (s.u.), Ducking
# ENTFÄLLT komplett, Ken Burns pro Clip variieren, Hochkant = fit: "blur", Text-Overlays
# nicht mittig / animiert / vor dem Fade weg, Speed-Ramps in Akt-2-Videos. Details in
# editorial-notes-round2.md §0.

preset: jga-zweiteiler

# Ziellänge ist ein OFFENER RICHTWERT. Die drei Musiktracks bestimmen die Länge, nicht
# umgekehrt. RUNDE 2: CL-Theme 181,5 s (Akt 1, ganz) + Miserlou-Loop ~196 s (Akt 2) + Where
# Is My Mind ab src_in ~17 s ~45 s + ~6 s Stille ≈ ~428 s ≈ 7:08. Der Wert unten wird in
# Task T7 auf die TATSÄCHLICH gebaute Länge nachgezogen (sonst bricht die QC-Längenprüfung
# ±2 s ab — HANDOVER). T7 (Runde 2): real gebaute timeline.duration = 428,4 s.
# RUNDE 3 (2026-09-10): chirurgischer Umbau — 8 Video-Streichungen + ein neues
# Vitrinen-Foto (IMG_1391) + Cast-Portraits auf 1,4 s + Danke-Karte länger; real
# gebaute timeline.duration = 422,2 s ≈ 7:02.
target_duration_s: 425.1
language: de

# ---------------------------------------------------------------- Overrides (über dem Preset)
# Farbe bleibt bewusst mild/einheitlich (kein Grade-Sprung Akt1/Akt2) — Preset-Default
# color_grade.mood=natural NICHT überschreiben. Party-Energie kommt aus Schnitt + Comic-FX.
color_match: soft

pacing:
  # rhythm bleibt mixed_by_chapter (Preset). Konkrete Fenster:
  #   Akt 1 "Gediegen": 3.5-6 s je Foto, lange Videoeinstellungen, ruhige Ken-Burns-Ausschnitte
  #   Akt 2 "Eskalation": 0.4-2.0 s Beat-Cuts auf Galvanize, wenig/keine Ken-Burns-Bewegung
  #   Aftermath/Outro: 4-8 s, nahezu statisch
  min_s: 0.4
  max_s: 6

photo_treatment:
  ken_burns: moderate   # Akt 1: ruhig. Akt 2: eher zügig ODER still (editorial-notes), nie hektisch.

text_density: bold_large   # Preset-Default; viele bewusst gesetzte Gag-Texte, s. editorial-notes

original_audio_policy: accent
# RUNDE 2: KEIN Ducking mehr, nirgends (Christian explizit: "du kannst überall das Ducking
#   rausnehmen"). Keine Duck-AudioClips. O-Ton-Stellen, die hörbar bleiben sollen (IMG_1460
#   Michas Lachen, IMG_1613/1637 Karaoke-Gesang, IMG_4835 Tequila-Anstoß), laufen nur als
#   leiser O-Ton-Clip UNTER durchlaufender, ungedämpfter Musik. Akt-2-Party-Videos: nur Musik.

# --------------------------------------------------------------------------- Audio / Musik
audio:
  # RUNDE 2 — Tracks komplett getauscht. Vivaldi + Galvanize fallen raus (Dateien bleiben
  # in music/ liegen). Neue Längen: CL-Theme 181,5 s, Miserlou 136,1 s -> loop-verlängert
  # ~196 s (music/"01 Miserlou (loop-196).m4a", von audio-designer gebaut), WIMM unverändert.
  tracks:
    - "01 Champions League Theme (Champions League Theme).m4a"  # Intro + Akt 1
    - "01 Miserlou (loop-196).m4a"                              # Akt 2 (loop-verlängerte Variante)
    - "07 Where Is My Mind_ (2007 Remaster).m4a"                # Aftermath/Outro (src_in ~17 s)
  structure_hint: three_parts
  # Akt 1 -> Akt 2: HARTER Wechsel, kein langer Crossfade. CL-Theme endet hart nach dem
  #   Pommes-Schwenk; Miserlou setzt ~0,5 s vorher ein, sein erster Beat sitzt auf dem Cut
  #   zum "3 Personen Daumen hoch"-Bild (die neu Dazugestoßenen). Miserlou von src_in 0.
  # Akt 2 -> Aftermath: ABRUPTER Cut in die Stille. Where Is My Mind mit src_in ~17 s
  #   einsteigen (nicht von vorne — "man kennt das Lied", direkt in die traurige Stelle).
  fade_in_s: 2      # CL-Theme kommt langsam hoch, während das Intro-Standbild steht
  fade_out_s: 4     # Where Is My Mind ganz ausfaden, BEVOR die Danke-Karte steht
  transition: cut

# ------------------------------------------------------------------------------- Intro
intro:
  transition_in: black          # Film STARTET auf Schwarz
  cold_open_s: 0
  # Ablauf: Schwarz -> weiche Blende in das Standbild design/assets/img/JGA_INTRO.png
  #   (= zugleich das Poster-Bild der Website), ein paar Sekunden halten, Vivaldi langsam
  #   hoch, dann weiche Schwarzblenden / ein paar Schnitte, dann rein in Akt 1.
  hero_still: "design/assets/img/JGA_INTRO.png"
  title: "Micha im Delirium"
  subtitle: "JGA · Brüssel 2026"
  fade: slow

# ------------------------------------------------------------------------------- Outro
outro:
  transition_out: black
  # Letztes Vollbild: design/assets/img/JGA_OUTRO.png ("Danke"). Musik ist da schon
  #   ausgefadet. Kurz halten, dann ins Schwarz. Falls JGA_OUTRO.png KEIN "Danke" trägt:
  #   danach eine schlichte credits-/title-card "Danke" (bestehendes SVG-Template).
  hero_still: "design/assets/img/JGA_OUTRO.png"

# --------------------------------------------------------------------------- Comic/Party-FX
