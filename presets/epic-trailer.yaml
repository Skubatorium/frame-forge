slug: epic-trailer
name: Epic Trailer
description: >-
  Kinoreifer Trailer. Grosse Musik, langsame Slow-Motion-Hoehepunkte im Wechsel mit harten
  Beat-Cuts, breites Cinemascope-Gefuehl, dramatische Typo. Eskalation auf einen Drop.
best_for: 90–120 s Kino-Trailer, grosse Geste
example: >-
  Weite Landschaft in Slow-Motion, tiefer Braaam-Ton, dann drei harte Cuts auf den Beat, Titel
  schlaegt ein, Drop mit den spektakulaersten Bildern.
arc: >-
  Ruhiger, grosser Aufbau -> Spannung zieht an -> Drop mit Hoehepunkt-Montage -> ein letztes
  monumentales Bild + Titelkarte.

pacing: { min_s: 0.6, max_s: 3.0, rhythm: escalating }
