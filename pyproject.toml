[project]
name = "frameforge"
version = "0.1.0"
description = "Orchestrierte, reproduzierbare Videoschnitt-Pipeline fuer Reise- und Projektfilme"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "numpy>=2.1,<3",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "scenedetect>=0.6.5",
    "librosa>=0.11",
    # librosa zieht sonst numba 0.53 (kein Python 3.12). 0.61 kann numpy 2.1+.
    "numba>=0.61",
    "soundfile>=0.12",
    "gpxpy>=1.6",
    "piexif>=1.1.3",
    "staticmap>=0.5.7",
    "cairosvg>=2.7",
    "opentimelineio>=0.17",
    # Kein FCPXML-Adapter im OTIO-Core mehr (aus opentimelineio-contrib ausgelagert) -
    # otio-fcpx-xml-adapter liefert den "fcpx_xml"-Adapter fuer nle.export_fcpxml.
    "otio-fcpx-xml-adapter>=1.0",
    "face-recognition>=1.3",
    # face-recognition-models nutzt intern noch pkg_resources; setuptools >=81 hat das
    # entfernt. Ohne Pin: "ModuleNotFoundError: No module named 'pkg_resources'".
    "setuptools<81",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
frameforge = "frameforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frameforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
