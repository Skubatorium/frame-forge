<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:854px;width:1280px;overflow:hidden}body{display:grid;grid-template-columns:960px 320px}
.mark{background:#1e1640;display:grid;place-items:center;padding:0 48px}
.mark span{font-family:var(--font-display);font-size:132px;line-height:.9;color:#ffcf5c;text-align:center;letter-spacing:.01em}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head><body>
<div class="mark"><span>Micha im Delirium</span></div>
<div class="strip"><i style="background:#ffcf5c"></i><i style="background:#35d6ff"></i><i style="background:#ff2e8a"></i><i style="background:#c8106a"></i></div>
</body></html>
