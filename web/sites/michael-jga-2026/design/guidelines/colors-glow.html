<!-- @dsCard group="Colors" viewport="700x160" name="Neon glow" subtitle="Thin contour + soft halo — never a flat fill" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);padding:10px 12px;font-size:11px;line-height:1.35;letter-spacing:.04em;text-transform:uppercase;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-1)}.sw b{font-weight:600;display:block}.sw span{opacity:.75;font-size:10px;letter-spacing:.06em}.g{grid-template-columns:repeat(3,1fr);place-items:center}.ring{width:96px;height:96px;border-radius:var(--radius-pill);display:grid;place-items:center;font-family:var(--font-display);font-size:30px}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-muted);margin-top:8px;text-align:center}</style>
</head><body><div class="g">
<div><div class="ring" style="box-shadow:inset 0 0 0 2px var(--gold-500),var(--glow-gold);color:var(--gold-400);text-shadow:var(--text-glow-gold)">♛</div><div class="lbl">--glow-gold</div></div>
<div><div class="ring" style="box-shadow:inset 0 0 0 2px var(--pink-500),var(--glow-pink);color:var(--pink-400);text-shadow:var(--text-glow-pink)">★</div><div class="lbl">--glow-pink</div></div>
<div><div class="ring" style="box-shadow:inset 0 0 0 2px var(--cyan-500),var(--glow-cyan);color:var(--cyan-400);text-shadow:var(--glow-cyan)">❤</div><div class="lbl">--glow-cyan</div></div>
</div></body></html>
