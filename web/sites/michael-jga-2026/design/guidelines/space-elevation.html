<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Three shadow steps; glow is separate and additive" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);padding:10px 12px;font-size:11px;line-height:1.35;letter-spacing:.04em;text-transform:uppercase;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-1)}.sw b{font-weight:600;display:block}.sw span{opacity:.75;font-size:10px;letter-spacing:.06em}.g{grid-template-columns:repeat(3,1fr);place-items:center}.t{width:150px;height:86px;background:var(--surface-card);border-radius:var(--radius-md);display:grid;place-items:center;font-size:10px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}</style>
</head><body><div class="g">
<div class="t" style="box-shadow:var(--shadow-1)">shadow 1</div>
<div class="t" style="box-shadow:var(--shadow-2)">shadow 2</div>
<div class="t" style="box-shadow:var(--shadow-3)">shadow 3</div>
</div></body></html>
