<!-- @dsCard group="Colors" viewport="700x190" name="Text on surface" subtitle="Contrast pairs that clear 4.5:1 for body copy" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);padding:10px 12px;font-size:11px;line-height:1.35;letter-spacing:.04em;text-transform:uppercase;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-1)}.sw b{font-weight:600;display:block}.sw span{opacity:.75;font-size:10px;letter-spacing:.06em}.g{grid-template-columns:repeat(3,1fr)}.box{padding:14px;border-radius:var(--radius-md);border:1px solid var(--border-quiet)}.box p{margin:0 0 6px;font-size:13px}.box small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style>
</head><body><div class="g">
<div class="box" style="background:var(--surface-page)"><p style="color:var(--text-body)">Fließtext auf der Seite</p><small>--text-body / --surface-page · 15.2:1</small></div>
<div class="box" style="background:var(--surface-card)"><p style="color:var(--text-body)">Fließtext in der Karte</p><small>--text-body / --surface-card · 12.6:1</small></div>
<div class="box" style="background:var(--grad-gold);border-color:transparent"><p style="color:var(--text-on-gold)">Label auf Gold</p><small style="color:#3a2a00">--text-on-gold / gold · 9.9:1</small></div>
</div></body></html>
