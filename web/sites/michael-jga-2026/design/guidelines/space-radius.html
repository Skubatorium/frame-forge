<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & strokes" subtitle="Chunky rings on stamps, pills on actions" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;font-family:var(--font-body)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-sm);padding:10px 12px;font-size:11px;line-height:1.35;letter-spacing:.04em;text-transform:uppercase;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-1)}.sw b{font-weight:600;display:block}.sw span{opacity:.75;font-size:10px;letter-spacing:.06em}.g{grid-template-columns:repeat(5,1fr);place-items:center}.t{width:86px;height:64px;background:var(--surface-card);border:2px solid var(--border-quiet);display:grid;place-items:center;font-size:10px;color:var(--text-muted);letter-spacing:.08em}</style>
</head><body><div class="g">
<div class="t" style="border-radius:var(--radius-xs)">4px</div><div class="t" style="border-radius:var(--radius-sm)">8px</div><div class="t" style="border-radius:var(--radius-md)">14px</div><div class="t" style="border-radius:var(--radius-lg)">22px</div><div class="t" style="border-radius:var(--radius-pill)">999px</div>
</div></body></html>
