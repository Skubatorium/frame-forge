<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-page);margin:0;padding:20px;font-family:var(--font-display)}
.sw{display:flex;gap:0;border-radius:var(--radius-2);overflow:hidden;border:1px solid var(--line-1)}
.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.06em;color:#eaf1f4}
.sw>div span{opacity:.72;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
</style></head><body><div style="display:flex;gap:12px"><div style="flex:1"><div style="height:52px;border:1px solid var(--line-2);border-radius:2px;background:var(--bg-raised)"></div><div style="font-size:10px;color:var(--text-3);margin-top:6px">--radius-1 · 2px</div></div><div style="flex:1"><div style="height:52px;border:1px solid var(--line-2);border-radius:4px;background:var(--bg-raised)"></div><div style="font-size:10px;color:var(--text-3);margin-top:6px">--radius-2 · 4px</div></div><div style="flex:1"><div style="height:52px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-raised)"></div><div style="font-size:10px;color:var(--text-3);margin-top:6px">--radius-3 · 8px</div></div><div style="flex:1"><div style="height:52px;border:1px solid var(--line-2);border-radius:14px;background:var(--bg-raised)"></div><div style="font-size:10px;color:var(--text-3);margin-top:6px">--radius-4 · 14px</div></div></div>
 <p style="color:var(--text-3);font-size:11px;margin-top:12px">Kein --radius-pill außer bei Punkten. Trennung immer über --line-1, nicht über Schatten.</p></body></html>
