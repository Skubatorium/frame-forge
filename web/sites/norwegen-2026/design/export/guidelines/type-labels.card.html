<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-page);margin:0;padding:20px;font-family:var(--font-display)}
.sw{display:flex;gap:0;border-radius:var(--radius-2);overflow:hidden;border:1px solid var(--line-1)}
.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.06em;color:#eaf1f4}
.sw>div span{opacity:.72;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
</style></head><body><p class="lbl">.label · --tracking-label 0.14em</p>
 <div style="display:flex;gap:32px;align-items:flex-end;margin-top:8px">
 <div><div style="font-size:40px;font-weight:500;color:var(--text-1);letter-spacing:-.02em;font-variant-numeric:tabular-nums">1.183<span style="font-size:20px;color:var(--text-3)"> m</span></div><div class="lbl" style="margin:6px 0 0">Höchster Punkt</div></div>
 <div><div style="font-size:40px;font-weight:500;color:var(--text-1);letter-spacing:-.02em;font-variant-numeric:tabular-nums">~4.000<span style="font-size:20px;color:var(--text-3)"> km</span></div><div class="lbl" style="margin:6px 0 0">Gesamtstrecke</div></div></div></body></html>
