<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-page);margin:0;padding:20px;font-family:var(--font-display)}
.sw{display:flex;gap:0;border-radius:var(--radius-2);overflow:hidden;border:1px solid var(--line-1)}
.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.06em;color:#eaf1f4}

</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
 <a class="btn btn--primary" href="#" style="outline:2px solid var(--focus-color);outline-offset:3px">Fokus sichtbar</a>
 <a class="btn btn--secondary" href="#">Sekundär</a>
 <a class="btn btn--secondary" href="#" style="background:var(--bg-raised);border-color:var(--accent-quiet)">Sekundär · Hover</a>
 <a class="btn btn--primary" href="#" aria-disabled="true">Deaktiviert</a></div>
 <p style="color:var(--text-3);font-size:11px;margin-top:14px">Aktiv: 1 px nach unten. Kein Schatten, kein Scale, kein Bounce.</p></body></html>
