<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-page);margin:0;padding:20px;font-family:var(--font-display)}
.sw{display:flex;gap:0;border-radius:var(--radius-2);overflow:hidden;border:1px solid var(--line-1)}
.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.06em;color:#eaf1f4}
.sw>div span{opacity:.72;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
</style></head><body><div style="display:flex;gap:12px">
 <div style="flex:1;background:var(--bg-sunken);border:1px solid var(--line-1);border-radius:var(--radius-3);padding:14px;color:var(--text-3);font-size:11px">--bg-sunken</div>
 <div style="flex:1;background:var(--bg-page);border:1px solid var(--line-1);border-radius:var(--radius-3);padding:14px;color:var(--text-3);font-size:11px">--bg-page</div>
 <div style="flex:1;background:var(--bg-raised);border:1px solid var(--line-1);border-radius:var(--radius-3);padding:14px;color:var(--text-3);font-size:11px">--bg-raised</div>
 <div style="flex:1;background:var(--bg-raised-hover);border:1px solid var(--line-2);border-radius:var(--radius-3);padding:14px;color:var(--text-3);font-size:11px">--bg-raised-hover<br>+ --line-2</div></div></body></html>
