<svg width="{{width}}" height="{{height}}" xmlns="http://www.w3.org/2000/svg">
  <!-- Unterzeilen-Text + halbtransparentes Panel dahinter, analog title-only.svg. Gegenstueck
       zu title-only.svg fuer den zweiten Slide-in-Layer (kommt typischerweise von der
       Gegenrichtung). -->
  <rect x="25%" y="{{subtitle_panel_y}}%" width="50%" height="{{subtitle_panel_h}}%"
        rx="{{corner_radius}}" ry="{{corner_radius}}"
        fill="{{primary_color}}" fill-opacity="{{panel_opacity}}"/>
  <text x="50%" y="58%" font-family="{{font_text}}" font-weight="700" font-style="normal"
        font-size="{{subtitle_size}}" fill="{{accent_color}}" text-anchor="middle"
        dominant-baseline="middle">{{subtitle}}</text>
</svg>
